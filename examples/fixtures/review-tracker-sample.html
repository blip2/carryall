    const kv = [['Tool', `${S.app.name} (${S.app.id})`], ['Tool version', S.app.version], ['Schema version', S.app.schemaVersion], ['Carryall core', CORE_VERSION],
      ['Home', S.app.home || '(none)'], ['Running from', S.isHome ? 'home site' : S.isLocal ? 'local file' : location.origin],
      ['File', S.fileName || '-'], ['Document id', m.docId || '-'], ['Save count', m.revision ?? '-'], ['Created', m.created || '-'],
      ['Last saved', m.savedAt || '-'], ['Updated by', S.data?.properties.updatedBy || '-'], ['Rows', rows], ['Data size', fmtBytes(bytes)],
      ['Migrations', (m.migrations || []).map(x => `${x.from}→${x.to} (${x.at.slice(0, 10)})`).join(', ') || '-']];
    dialog({ title: 'About this file', wide: true,
      body: h('div', h('dl', { class: 'ca-kv' }, kv.map(([k, v]) => [h('dt', k), h('dd', String(v))])),
        S.app.description && h('p', { class: 'ca-muted' }, S.app.description)),
      buttons: [{ label: 'Run self-test', left: true, onClick: () => { selfTest(true); return false; } }, { label: 'Close', value: null, primary: true }] });
  }

  // ── Self-test (for app authors and LLMs) ───────────────────────────────
  function selfTest(show = false) {
    const res = [];
    const ok = (name, pass, detail = '') => res.push({ pass: !!pass, name, detail });
    const app = S.app;
    const temp = !S.data;
    if (temp) S.data = newDocument();
    try {
      for (const [tk, td] of Object.entries(app.tables)) {
        for (const c of Object.values(td.columns)) {
          const where = `${tk}.${c.key}`;
          ok(`${where} type`, COLUMN_TYPES.includes(c.type), c.type);
          if (c.type === 'choice') ok(`${where} options`, Array.isArray(c.options) && c.options.length);
          if (c.type === 'ref') ok(`${where} ref target`, !!app.tables[c.table], c.table);
          if (c.type === 'computed') ok(`${where} fn`, typeof c.fn === 'function');
        }
        ok(`${tk} display column`, typeof td.display === 'function' || !!td.columns[td.display], String(td.display));
      }
      for (let v = 2; v <= app.schemaVersion; v++) ok(`migration to v${v}`, typeof app.migrations[v] === 'function');
      const extra = Object.keys(app.migrations).map(Number).filter(v => v < 2 || v > app.schemaVersion);
      ok('no stray migrations', !extra.length, extra.join(','));
      const probe = h('div');
      app.views.forEach((v, i) => {
        const errs = [];
        const orig = console.error; console.error = (...a) => errs.push(a.join(' '));
        try { renderView(probe, v, `selftest.${i}`); } finally { console.error = orig; }
        ok(`view "${v.title}" renders`, !errs.length && !probe.textContent.includes('failed to render') && !probe.textContent.includes('Unknown view type'), errs.join('; '));
        probe.textContent = '';
      });
      const saved = S.data;
      for (const fx of app.fixtures || []) {
        try {
          let d = clone(fx.doc);
          if ((d.app?.schemaVersion || 1) < app.schemaVersion) d = migrate(d);
          normalise(d);
          S.data = d;
          let bad = 0;
          for (const [tk, td] of Object.entries(app.tables)) for (const r of d.tables[tk]) for (const c of Object.values(td.columns)) {
            if (c.type === 'computed') { const v = rawValue(tk, r, c.key); if (typeof v === 'number' && isNaN(v)) bad++; }
            if (c.type === 'ref' && r[c.key] && !d.tables[c.table].some(x => x.id === r[c.key])) bad++;
          }
          ok(`fixture "${fx.name}" migrates cleanly`, !bad, bad ? `${bad} bad values` : '');
          if (fx.expect) ok(`fixture "${fx.name}" expectations`, fx.expect(d, makeApi()) !== false);
        } catch (e) { ok(`fixture "${fx.name}"`, false, e.message); }
        finally { S.data = saved; }
      }
      if (S.data && !temp) {
        const html = buildFile(prepareForSave());
        const back = extractFromHtml(html);
        ok('export round-trip preserves data', JSON.stringify(back.tables) === JSON.stringify(S.data.tables) && JSON.stringify(back.settings) === JSON.stringify(S.data.settings));
        ok('export round-trip preserves document properties', JSON.stringify(back.properties.revisions) === JSON.stringify(S.data.properties.revisions) && back.properties.projectNumber === S.data.properties.projectNumber);
        ok('export contains core + app scripts', /id="ca-core"/.test(html) && /id="ca-app"/.test(html));
      }
    } catch (e) { ok('self-test crashed', false, e.stack || e.message); }
    finally { if (temp) S.data = null; }
    const failed = res.filter(r => !r.pass);
    console[failed.length ? 'warn' : 'log'](`[carryall] self-test: ${res.length - failed.length}/${res.length} passed`, failed);
    if (show) {
      dialog({ title: `Self-test: ${res.length - failed.length}/${res.length} passed`, wide: true,
        body: h('table', { class: 'ca-table' }, h('tbody', res.map(r => h('tr', h('td', r.pass ? 'Pass' : UI.pill('Fail', 'red')), h('td', r.name), h('td', { class: 'ca-muted' }, r.detail))))) });
    }
    return { passed: res.length - failed.length, failed: failed.length, results: res };
  }

  // ── Boot ───────────────────────────────────────────────────────────────
  function bindGlobal() {
    window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('keydown', e => {
      const mod = e.ctrlKey || e.metaKey;
      if (!mod || !S.data) return;
      const k = e.key.toLowerCase();
      if (k === 's') { e.preventDefault(); save({ as: e.shiftKey }); return; }
      if (document.querySelector('dialog[open]') || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    });
    document.addEventListener('click', e => {
      document.querySelectorAll('details.ca-menu[open]').forEach(d => { if (!d.contains(e.target) || e.target.closest('.ca-menu-list button')) d.open = false; });
    });
    let depth = 0;
    const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
    document.addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; document.body.classList.add('ca-dragging'); } });
    document.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('ca-dragging'); } });
    document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
    document.addEventListener('drop', async e => {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0; document.body.classList.remove('ca-dragging');
      const item = e.dataTransfer.items?.[0];
      const handleP = S.app.saveInPlace && item?.getAsFileSystemHandle ? item.getAsFileSystemHandle().catch(() => null) : null;
      const file = e.dataTransfer.files[0];
      const handle = handleP ? await handleP : null;
      if (file) openFile(file, handle && handle.kind === 'file' ? handle : null);
    });
  }
  async function boot() {
    S.root = document.getElementById('ca-root');
    if (!S.app) {
      S.root.textContent = S.defineError
        ? `Carryall: the app definition has an error. ${S.defineError.message}`
        : 'Carryall: no app defined. Add Carryall.app({...}) in <script id="ca-app">.';
      return;
    }
    captureShell();
    S.isHome = computeIsHome();
    const api = makeApi();
    for (const p of S.plugins) { try { p.setup && p.setup(api); } catch (e) { console.error(`[carryall] plugin ${p.name} failed`, e); } }
    bindGlobal();
    const raw = document.getElementById('ca-data')?.textContent.trim();
    if (raw && raw !== 'null') {
      try {
        const last = decodeURIComponent(location.pathname.split('/').pop());
        const name = /.html?$/i.test(last) ? last : null;
        await loadDocument(JSON.parse(raw), { fileName: name, source: 'embedded' });
      } catch (e) {
        console.error(e);
        addBanner('load', 'warn', `The data in this file could not be loaded: ${e.message}`);
        render();
      }
    } else render();
    listenForHandoff();
    identify();
    checkForUpdate();
    if (/[?&]selftest\b/.test(location.search)) selfTest(true);
  }

  window.Carryall = Object.freeze({
    version: CORE_VERSION,
    app: defineApp,
    plugin(p) {
      if (!p || !p.name) throw new Error('Carryall.plugin needs a name');
      S.plugins.push(p);
      Object.assign(S.viewTypes, p.views || {});
    },
    h, ui: UI, util: Util,
    get api() { return makeApi(); },
    selfTest,
    _state: S, // for debugging only; not a stable API
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else queueMicrotask(boot);
})();
</script>
<script id="ca-app">
/* ═══════════════════════════════════════════════════════════════════════
   DESIGN REVIEW TRACKER: example Carryall app.
   Tracks discipline design reviews on a building project as a comment
   and response register:
     disciplines  who is on the design team (seeded for a new document)
     reviews      one review package: discipline X reviews discipline Y's
                  deliverables at a RIBA stage, with a response due date
     comments     individual review comments, the design team's response,
                  and closure
   Comment workflow: Open (raised) -> Responded (design team replied)
     -> Closed (reviewer accepts) or Withdrawn. Dates are filled in
     automatically by the onSave hook on the comments table.
   Project number/name, revisions and checked-by are Carryall's built-in
   document properties, so they are not defined here.
   ═══════════════════════════════════════════════════════════════════════ */

const OPEN = ['Open', 'Responded'];          // comment statuses still needing action
const STAGES = ['Stage 2 Concept Design', 'Stage 3 Spatial Coordination', 'Stage 4 Technical Design', 'Stage 5 Manufacturing & Construction'];
const DISCIPLINES = [
  ['AR', 'Architecture'], ['ST', 'Structural Engineering'], ['CV', 'Civil Engineering'],
  ['ME', 'Mechanical Services'], ['EL', 'Electrical Services'], ['PH', 'Public Health'],
  ['FI', 'Fire Engineering'], ['FA', 'Facade Engineering'], ['AC', 'Acoustics'],
  ['LA', 'Landscape'], ['SU', 'Sustainability'], ['PD', 'Principal Designer (CDM)'],
];

// Next reference like DR-03 or RC-0042, one higher than the largest in use.
function nextRef(api, table, prefix, width) {
  let max = 0;
  for (const r of api.rows(table)) {
    const m = new RegExp('^' + prefix + '(\\d+)$').exec(r.ref || '');
    if (m) max = Math.max(max, +m[1]);
  }
  return prefix + String(max + 1).padStart(width, '0');
}
const asAt = api => api.settings.asAt || api.today;
const reviewOf = (api, c) => api.row('reviews', c.review);

Carryall.app({
  id: 'design-review-tracker',
  name: 'Design Review Tracker',
  version: '1.0.0',
  schemaVersion: 1,
  description: 'Discipline design reviews for a building project: review packages, comments, responses and close-out.',
  home: 'http://localhost:8765/review-tracker.html',   // replace with the hosted URL
  versionUrl: 'http://localhost:8765/review-tracker.version.json',
  locale: 'en-GB',
  fileName: 'design-review-tracker',

  settings: {
    columns: {
      responseDays: { type: 'number', label: 'Default response period (days)', decimals: 0, min: 1, default: 10,
                      help: 'Sets the "responses due" date on new reviews.' },
      dueSoonDays:  { type: 'number', label: 'Flag as "due soon" within (days)', decimals: 0, min: 0, default: 5 },
      asAt:         { type: 'date', label: 'Report date', help: 'Overdue and days-open are measured to this date. Leave blank for today.' },
    },
  },

  onNew: doc => {
    doc.tables.disciplines = DISCIPLINES.map(([code, name]) => ({ id: Carryall.util.uid(), code, name }));
  },

  tables: {
    disciplines: {
      label: 'Disciplines', singular: 'discipline', display: r => `${r.code} ${r.name || ''}`.trim(),
      columns: {
        code:         { type: 'text', required: true, unique: true, mono: true, help: 'Short code, for example AR, ST or ME.' },
        name:         { type: 'text', required: true },
        organisation: { type: 'text' },
        lead:         { type: 'text', label: 'Discipline lead' },
        toAnswer:     { type: 'computed', label: 'Open comments to answer', format: 'integer',
                        fn: (d, api) => api.count('comments', c => OPEN.includes(c.status) && reviewOf(api, c)?.reviewed === d.id) },
        raised:       { type: 'computed', label: 'Comments raised', format: 'integer',
                        fn: (d, api) => api.count('comments', c => reviewOf(api, c)?.reviewing === d.id) },
      },
    },

    reviews: {
      label: 'Reviews', singular: 'review', display: r => `${r.ref} ${r.title || ''}`.trim(),
      columns: {
        ref:       { type: 'text', label: 'Ref', required: true, unique: true, mono: true, default: api => nextRef(api, 'reviews', 'DR-', 2) },
        title:     { type: 'text', required: true, help: 'e.g. "Stage 3 structural review of architectural GAs".' },
        stage:     { type: 'choice', options: STAGES },
        reviewed:  { type: 'ref', table: 'disciplines', label: 'Package by', required: true,
                     help: 'The discipline whose deliverables are being reviewed (they respond).' },
        reviewing: { type: 'ref', table: 'disciplines', label: 'Reviewed by', required: true },
        reviewer:  { type: 'text', label: 'Reviewer', default: api => api.user },
        documents: { type: 'longtext', label: 'Documents reviewed', help: 'Drawing / document numbers and revisions, one per line.' },
        issued:    { type: 'date', label: 'Package issued', default: api => api.today },
        due:       { type: 'date', label: 'Responses due', default: api => api.util.addDays(api.today, api.settings.responseDays || 10) },
        status:    { type: 'choice', options: ['Planned', 'In review', 'Comments issued', 'Closed'], default: 'In review',
                     colors: { Planned: 'grey', 'In review': 'blue', 'Comments issued': 'purple', Closed: 'green' } },
        comments:  { type: 'computed', label: 'Comments', format: 'integer',
                     fn: (r, api) => api.count('comments', c => c.review === r.id && c.status !== 'Withdrawn') },
        open:      { type: 'computed', label: 'Open', format: 'integer',
                     fn: (r, api) => api.count('comments', c => c.review === r.id && OPEN.includes(c.status)) },
        closedPct: { type: 'computed', label: 'Closed', format: 'percent', decimals: 0,
                     fn: (r, api) => {
                       const n = api.value('reviews', r, 'comments');
                       return n ? Math.round(100 * (n - api.value('reviews', r, 'open')) / n) : null;
                     } },
        overdue:   { type: 'computed', label: 'Overdue', format: 'integer', colors: v => (v ? 'red' : null),
                     fn: (r, api) => (r.due && r.due < asAt(api) ? api.count('comments', c => c.review === r.id && c.status === 'Open') : 0) },
      },
    },

    comments: {
      label: 'Comments', singular: 'comment', display: r => r.ref,
      columns: {
        ref:         { type: 'text', label: 'Ref', required: true, unique: true, mono: true, default: api => nextRef(api, 'comments', 'RC-', 4) },
        review:      { type: 'ref', table: 'reviews', required: true, display: 'ref', mono: true },
        document:    { type: 'text', label: 'Document / drawing', mono: true },
        location:    { type: 'text', label: 'Location / clause', help: 'Gridline, level, room, sheet zone or spec clause.' },
        topic:       { type: 'choice', options: ['Coordination', 'Compliance', 'Buildability', 'Design quality', 'Health & safety', 'Sustainability', 'Cost', 'Other'] },
        priority:    { type: 'choice', options: ['Critical', 'Major', 'Minor'], required: true, default: 'Major',
                       colors: { Critical: 'red', Major: 'amber', Minor: 'grey' },
                       help: 'Critical: must resolve before the next stage/issue. Major: resolve this stage. Minor: advisory.' },
        comment:     { type: 'longtext', required: true },
        raisedBy:    { type: 'text', label: 'Raised by', default: api => api.user },
        raised:      { type: 'date', label: 'Raised', default: api => api.today },
        response:    { type: 'longtext', label: 'Design team response' },
        action:      { type: 'choice', label: 'Response type', options: ['Agreed', 'Agreed in part', 'Not agreed', 'Clarification'] },
        respondedBy: { type: 'text', label: 'Responded by' },
        responded:   { type: 'date', label: 'Responded' },
        status:      { type: 'choice', options: ['Open', 'Responded', 'Closed', 'Withdrawn'], default: 'Open', required: true,
                       colors: { Open: 'blue', Responded: 'purple', Closed: 'green', Withdrawn: 'grey' },
                       help: 'Open: awaiting response. Responded: awaiting reviewer. Closed: accepted by reviewer.' },
        closed:      { type: 'date', label: 'Closed', help: 'Set automatically when the comment is closed or withdrawn.' },
        actionBy:    { type: 'computed', label: 'Action by', format: 'text',
                       fn: (c, api) => {
                         const rv = reviewOf(api, c);
                         if (!rv || !OPEN.includes(c.status)) return '';
                         const who = api.row('disciplines', c.status === 'Open' ? rv.reviewed : rv.reviewing);
                         return who ? who.code : '';
                       } },
        due:         { type: 'computed', label: 'Response due', format: 'date', fn: (c, api) => reviewOf(api, c)?.due || null },
        flag:        { type: 'computed', label: 'Flag', format: 'text',
                       colors: { Overdue: 'red', 'Due soon': 'amber' },
                       fn: (c, api) => {
                         const due = reviewOf(api, c)?.due;
                         if (c.status !== 'Open' || !due) return '';
                         const left = api.util.daysBetween(asAt(api), due);
                         return left < 0 ? 'Overdue' : left <= (api.settings.dueSoonDays ?? 5) ? 'Due soon' : '';
                       } },
        daysOpen:    { type: 'computed', label: 'Days open', format: 'integer',
                       fn: (c, api) => (c.raised ? api.util.daysBetween(c.raised, c.closed || asAt(api)) : null) },
      },
      validate: row => {
        if (row.status === 'Responded' && !row.response) return { response: 'Add the response before marking it responded.' };
        if (row.status === 'Closed' && row.priority === 'Critical' && !row.response) return { response: 'Critical comments need a recorded response to close.' };
        return {};
      },
      // Keep workflow dates consistent with the status.
      onSave: (row, before, api) => {
        if (row.response && !before?.response && row.status === 'Open') row.status = 'Responded';
        if (row.response && !row.responded) row.responded = api.today;
        if (row.response && !row.respondedBy && row.status !== 'Open') row.respondedBy = api.user;
        if (['Closed', 'Withdrawn'].includes(row.status)) { if (!row.closed) row.closed = api.today; }
        else row.closed = null;
      },
    },
  },

  views: [
    { type: 'dashboard', title: 'Overview', blocks: [
      { type: 'kpi', items: [
        { label: 'Open comments', format: 'integer', value: api => api.count('comments', c => c.status === 'Open') },
        { label: 'Awaiting reviewer', format: 'integer', value: api => api.count('comments', c => c.status === 'Responded') },
        { label: 'Overdue', format: 'integer', value: api => api.count('comments', c => api.value('comments', c, 'flag') === 'Overdue') },
        { label: 'Critical still open', format: 'integer', value: api => api.count('comments', c => c.priority === 'Critical' && OPEN.includes(c.status)) },
        { label: 'Closed', format: 'percent', decimals: 0, value: api => {
            const live = api.count('comments', c => c.status !== 'Withdrawn');
            return live ? 100 * api.count('comments', c => c.status === 'Closed') / live : null;
          } },
      ] },
      { type: 'summary', title: 'Open comments by who must act', table: 'comments', groupBy: 'actionBy',
        metrics: [{ label: 'Open', op: 'count' }], where: c => OPEN.includes(c.status) },
      { type: 'summary', title: 'Open comments by priority', table: 'comments', groupBy: 'priority',
        metrics: [{ label: 'Open', op: 'count' }, { label: 'Avg days open', op: 'avg', column: 'daysOpen', format: 'integer' }],
        where: c => OPEN.includes(c.status) },
      { type: 'summary', title: 'All comments by status', table: 'comments', groupBy: 'status', metrics: [{ label: 'Comments', op: 'count' }] },
      { type: 'summary', title: 'Open comments by topic', table: 'comments', groupBy: 'topic',
        metrics: [{ label: 'Open', op: 'count' }], where: c => OPEN.includes(c.status) },
      { type: 'summary', title: 'Comments raised by month', table: 'comments', groupBy: 'raised', bucket: 'month',
        metrics: [{ label: 'Raised', op: 'count' }], wide: true },
    ] },
    { type: 'table', title: 'Comments', table: 'comments',
      columns: ['ref', 'review', 'document', 'location', 'priority', 'comment', 'status', 'actionBy', 'due', 'flag', 'daysOpen'],
      sort: { key: 'ref', dir: 'asc' }, filters: ['review', 'actionBy', 'priority', 'status', 'flag'] },
    { type: 'table', title: 'Reviews', table: 'reviews',
      columns: ['ref', 'title', 'stage', 'reviewed', 'reviewing', 'issued', 'due', 'status', 'comments', 'open', 'closedPct', 'overdue'],
      sort: { key: 'ref', dir: 'asc' }, filters: ['stage', 'status'], totals: ['comments', 'open', 'overdue'] },
    { type: 'custom', title: 'Matrix', render: reviewMatrix },
    { type: 'custom', title: 'Comment sheet', render: commentSheet },
    { type: 'table', title: 'Disciplines', table: 'disciplines', sort: { key: 'code', dir: 'asc' },
      columns: ['code', 'name', 'organisation', 'lead', 'toAnswer', 'raised'] },
    { type: 'settings', title: 'Settings', intro: 'Project number, name, revisions and checking are under the document line beneath the title.' },
  ],

  migrations: {},

  fixtures: [
    { name: 'minimal v1', doc: { app: { id: 'design-review-tracker', schemaVersion: 1 }, tables: {
      disciplines: [{ id: 'd1', code: 'AR', name: 'Architecture' }, { id: 'd2', code: 'ST', name: 'Structural Engineering' }],
      reviews: [{ id: 'r1', ref: 'DR-01', title: 'Stage 3 review', reviewed: 'd1', reviewing: 'd2', due: '2020-01-10', status: 'Comments issued' }],
      comments: [
        { id: 'c1', ref: 'RC-0001', review: 'r1', priority: 'Critical', comment: 'Transfer beam clashes with duct.', status: 'Open', raised: '2020-01-01' },
        { id: 'c2', ref: 'RC-0002', review: 'r1', priority: 'Minor', comment: 'Label gridlines.', status: 'Closed', raised: '2020-01-01', closed: '2020-01-05', response: 'Done' },
      ] } },
      expect: (d, api) => api.value('comments', d.tables.comments[0], 'flag') === 'Overdue'
        && api.value('reviews', d.tables.reviews[0], 'closedPct') === 50
        && api.value('comments', d.tables.comments[0], 'actionBy') === 'AR' },
  ],
});

/* ── Custom view: who-reviews-whom matrix ───────────────────────────────
   Rows: the discipline that must respond (package author).
   Columns: the reviewing discipline. Cell: open / total comments. */
function reviewMatrix(el, api) {
  const { h } = api;
  const reviews = new Map(api.rows('reviews').map(r => [r.id, r]));
  const cells = new Map();
  for (const c of api.rows('comments')) {
    const rv = reviews.get(c.review);
    if (!rv || c.status === 'Withdrawn') continue;
    const key = rv.reviewed + '|' + rv.reviewing;
    const cell = cells.get(key) || { total: 0, open: 0, overdue: 0, items: [] };
    cell.total++;
    if (OPEN.includes(c.status)) cell.open++;
    if (api.value('comments', c, 'flag') === 'Overdue') cell.overdue++;
    cell.items.push(c);
    cells.set(key, cell);
  }
  const byCode = (a, b) => a.code.localeCompare(b.code);
  const rowIds = new Set([...cells.keys()].map(k => k.split('|')[0]));
  const colIds = new Set([...cells.keys()].map(k => k.split('|')[1]));
  const rowsD = api.rows('disciplines').filter(d => rowIds.has(d.id)).sort(byCode);
  const colsD = api.rows('disciplines').filter(d => colIds.has(d.id)).sort(byCode);
  if (!rowsD.length) {
    el.append(api.ui.card('Review matrix', h('p', { class: 'ca-muted' }, 'No comments yet. Add reviews and comments to see who is reviewing whom.')));
    return;
  }
  const showCell = (row, col, cell) => api.ui.dialog({
    title: `${row.code} comments from ${col.code} review (${cell.open} open of ${cell.total})`, wide: true,
    body: h('div', { class: 'ca-table-wrap' }, h('table', { class: 'ca-table' },
      h('thead', h('tr', ['Ref', 'Priority', 'Comment', 'Status', 'Flag'].map(x => h('th', x)))),
      h('tbody', cell.items.map(c => h('tr', { class: 'clickable', onclick: () => api.openForm('comments', c.id) },
        h('td', c.ref), h('td', api.ui.pill(c.priority || '', { Critical: 'red', Major: 'amber' }[c.priority])),
        h('td', c.comment && c.comment.length > 120 ? c.comment.slice(0, 119) + '…' : c.comment),
        h('td', c.status), h('td', api.format('comments', c, 'flag')))))))
  });
  el.append(api.ui.card('Review matrix: open / total comments',
    h('div', { class: 'ca-table-wrap' }, h('table', { class: 'ca-table rt-matrix' },
      h('thead', h('tr', h('th', 'Must respond ↓ / Reviewed by →'), colsD.map(d => h('th', { title: d.name }, d.code)))),
      h('tbody', rowsD.map(row => h('tr', h('th', { scope: 'row' }, api.display('disciplines', row)), colsD.map(col => {
        const cell = cells.get(row.id + '|' + col.id);
        if (!cell) return h('td', row.id === col.id ? h('span', { class: 'ca-muted' }, '·') : '');
        const color = cell.overdue ? 'red' : cell.open ? 'amber' : 'green';
        return h('td', h('button', { class: 'rt-cell', type: 'button', title: `${cell.overdue} overdue`, onclick: () => showCell(row, col, cell) },
          api.ui.pill(`${cell.open} / ${cell.total}`, color)));
      })))))),
    h('div', { class: 'rt-legend' }, api.ui.pill('overdue', 'red'), api.ui.pill('open', 'amber'), api.ui.pill('all closed', 'green'),
      h('span', { class: 'ca-muted' }, 'Click a cell to see its comments.'))));
}

/* ── Custom view: printable comment / response sheet for one review ───── */
let sheetReviewId = null;
function commentSheet(el, api) {
  const { h } = api;
  const reviews = [...api.rows('reviews')].sort((a, b) => (a.ref || '').localeCompare(b.ref || ''));
  if (!reviews.length) { el.append(api.ui.card('Comment sheet', h('p', { class: 'ca-muted' }, 'No reviews yet.'))); return; }
  if (!reviews.some(r => r.id === sheetReviewId)) sheetReviewId = reviews[0].id;
  const rv = api.row('reviews', sheetReviewId);
  const p = api.properties || {};
  const rev = api.revision;
  const comments = api.rows('comments').filter(c => c.review === rv.id)
    .sort((a, b) => (a.ref || '').localeCompare(b.ref || ''));
  const kv = (k, v) => h('div', h('dt', k), h('dd', v || 'Not set'));
  el.append(
    h('div', { class: 'ca-tv-bar rt-noprint' },
      h('select', { class: 'ca-select', 'aria-label': 'Review', onchange: e => { sheetReviewId = e.target.value; api.rerender(); } },
        reviews.map(r => h('option', { value: r.id, selected: r.id === rv.id }, api.display('reviews', r)))),
      h('span', { class: 'ca-spacer' }),
      h('button', { class: 'ca-btn', onclick: () => api.openForm('comments', null, { review: rv.id }) }, '+ Add comment'),
      h('button', { class: 'ca-btn primary', onclick: () => window.print() }, 'Print comment sheet')),
    h('div', { class: 'ca-card' },
      h('h2', `Design review comment sheet: ${rv.ref}`),
      h('dl', { class: 'rt-sheet-head' },
        kv('Project', [p.projectNumber, p.projectName].filter(Boolean).join(' ')),
        kv('Tracker revision', rev ? `${rev.rev} (${api.formatAs('date', rev.date)})` : ''),
        kv('Review', rv.title), kv('Stage', rv.stage),
        kv('Package by', api.format('reviews', rv, 'reviewed')), kv('Reviewed by', api.format('reviews', rv, 'reviewing')),
        kv('Reviewer', rv.reviewer), kv('Package issued', api.formatAs('date', rv.issued)),
        kv('Responses due', api.formatAs('date', rv.due)), kv('Status', `${rv.status || ''} · ${api.value('reviews', rv, 'open')} open of ${api.value('reviews', rv, 'comments')}`)),
      rv.documents && h('p', { style: { whiteSpace: 'pre-wrap', fontSize: '13px' } }, h('strong', 'Documents reviewed: '), rv.documents),
      h('div', { class: 'ca-table-wrap' }, h('table', { class: 'ca-table rt-sheet' },
        h('thead', h('tr', ['Ref', 'Document', 'Location', 'Priority', 'Comment', 'Response', 'Status'].map(x => h('th', x)))),
        h('tbody', comments.length ? comments.map(c => h('tr', { class: 'clickable', onclick: () => api.openForm('comments', c.id) },
          h('td', c.ref), h('td', c.document || ''), h('td', c.location || ''),
          h('td', api.ui.pill(c.priority || '', { Critical: 'red', Major: 'amber' }[c.priority])),
          h('td', { class: 'rt-text' }, c.comment || ''),
          h('td', { class: 'rt-text' }, c.response ? `${c.action ? c.action + ': ' : ''}${c.response}` : ''),
          h('td', c.status, c.closed ? h('div', { class: 'ca-muted' }, api.formatAs('date', c.closed)) : '')))
          : h('tr', h('td', { class: 'ca-empty', colspan: 7 }, 'No comments on this review yet.')))))));
}
</script>
